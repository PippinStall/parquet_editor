services:
  backend:
    build: ./backend
    env_file:
      - ./.env
    ports:
      - "${BACKEND_PORT:-18010}:8000"
    volumes:
      - ./backend/${STORAGE_DIR:-storage}:/app/${STORAGE_DIR:-storage}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      - backend
    restart: unless-stopped
